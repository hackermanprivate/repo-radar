[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-radar"
version = "0.1.0"
description = "Find GitHub repositories that are rising fast, not merely large."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hackermanprivate" }]
keywords = ["github", "trending", "cli", "discovery", "stars"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = []

[project.scripts]
repo-radar = "repo_radar.cli:main"

[project.urls]
Homepage = "https://github.com/hackermanprivate/repo-radar"

[tool.setuptools]
packages = ["repo_radar"]
